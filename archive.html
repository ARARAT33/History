<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive — HISTORY</title><link rel="stylesheet" href="pages.css"></head><body class="page-body"><main class="page-main"><section class="hero-card"><span class="page-kicker">LOCAL WORKSPACE</span><h1>Archive</h1><p>This is an empty local workspace. Nothing is preloaded.</p><label class="action-btn" style="display:inline-block">Choose files<input id="archive-files" type="file" multiple hidden></label><div id="archive-list" class="rank-list" style="margin-top:15px"></div></section></main><script>const input=document.getElementById("archive-files"),list=document.getElementById("archive-list");input?.addEventListener("change",e=>{list.innerHTML=[...e.target.files].map(f=>'<div class="rank-item"><div class="rank-no">FILE</div><div><h3>'+f.name.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</h3><p>'+Math.round(f.size/1024)+' KB</p></div></div>').join("")||'<div class="empty-state">No files selected.</div>'});</script><script src="site-tools.js?v=20260927-4"></script></body></html>
