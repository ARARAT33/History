<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Արխիվ — History</title><link rel="stylesheet" href="pages.css?v=1"></head><body class="page-body"><header class="page-hero"><div class="page-kicker">LOCAL ARCHIVE</div><h1>Archive</h1><p>A local file workspace for downloaded historical material. This page intentionally contains no preloaded archive content.</p></header><main class="page-main"><section class="hero-card"><div class="empty-state"><strong>Your archive is empty.</strong><p>Nothing is preloaded here. Downloaded files can be stored locally on your device and opened from your own file manager.</p><button class="action-btn" id="archive-folder" type="button">Choose local folder</button><input id="archive-files" type="file" multiple hidden><div id="archive-list" class="rank-list" style="margin-top:14px"></div></div></section></main><script>document.getElementById("archive-folder")?.addEventListener("click",()=>document.getElementById("archive-files").click());document.getElementById("archive-files")?.addEventListener("change",e=>{const r=document.getElementById("archive-list");r.innerHTML=[...e.target.files].map(f=>"<div class=\"rank-item\"><div class=\"rank-no\">FILE</div><div><h3>"+f.name.replaceAll("<","&lt;")+"</h3><p>"+Math.round(f.size/1024)+" KB</p></div></div>").join("")||"<div class=\"empty-state\">No files selected.</div>"});</script><script src="site-tools.js?v=20260927-3"></script></body></html>
