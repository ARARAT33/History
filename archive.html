<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archive — HISTORY</title><link rel="stylesheet" href="pages.css">
<style>
.archive-wrap{max-width:1100px;margin:0 auto;padding:24px}.archive-hero{margin-bottom:24px}
.archive-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.archive-card{padding:24px;border:1px solid rgba(127,127,127,.2);border-radius:20px;background:rgba(255,255,255,.035);box-shadow:0 12px 35px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:12px}
.archive-card h3{margin:0;font-size:1.25rem;overflow-wrap:anywhere}.archive-card p{margin:0;line-height:1.7;opacity:.84;overflow-wrap:anywhere}
.archive-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.76rem;opacity:.6;overflow-wrap:anywhere}
.archive-text{padding-top:14px;border-top:1px solid rgba(127,127,127,.16);white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere}
.archive-empty,.archive-error{padding:28px;border:1px dashed rgba(127,127,127,.35);border-radius:18px;text-align:center;opacity:.8}
</style></head><body class="page-body">
<main class="page-main archive-wrap">
<section class="hero-card archive-hero"><span class="page-kicker">HISTORY ARCHIVE</span><h1>Archive</h1><p>Names, descriptions and text from the AWEArchiveDB archive.</p></section>
<section id="archive-content" class="archive-grid" aria-live="polite"><div class="archive-empty">Loading archive records…</div></section>
</main>
<script>
(function(){
"use strict";const DATA_URL="https://raw.githubusercontent.com/ARARAT33/AWEArchiveDB/refs/heads/main/history.json");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const first=(o,keys)=>{for(const k of keys){if(o&&o[k]!=null&&String(o[k]).trim()!=="")return o[k]}return""};
const asArray=data=>{if(Array.isArray(data))return data;for(const k of ["items","records","history","archive","data","results"])if(Array.isArray(data?.[k]))return data[k];return[]};
function card(item,index){const id=first(item,["id","ID","uuid","identifier"])||("record-"+(index+1));const name=first(item,["name","title","label","filename","slug"])||"Untitled";const description=first(item,["description","desc","summary"])||"";const body=first(item,["text","content","body","article","textContent"])||"";return '<article class="archive-card"><div class="archive-id">ID · '+esc(id)+'</div><h3>'+esc(name)+'</h3>'+(description?'<p>'+esc(description)+'</p>':"")+(body?'<div class="archive-text">'+esc(body)+'</div>':"")+"</article>"}
async function load(){const root=document.getElementById("archive-content");try{const res=await fetch(DATA_URL,{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);const rows=asArray(await res.json()).filter(x=>x&&typeof x==="object");root.innerHTML=rows.length?rows.map(card).join(""):'<div class="archive-empty" style="grid-column:1/-1">No archive records are currently available.</div>'}catch(e){console.error(e);root.innerHTML='<div class="archive-error" style="grid-column:1/-1">Archive data could not be loaded right now.</div>'}}load();
})();
</script><script src="site-tools.js?v=20260927-4"></script></body></html>
