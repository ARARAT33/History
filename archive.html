<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archive — HISTORY</title><link rel="stylesheet" href="pages.css">
<style>
.archive-wrap{max-width:1280px;margin:auto;padding:22px}.archive-hero{margin-bottom:18px}.archive-tools{display:flex;gap:10px;align-items:center;margin-bottom:20px;padding:12px;border:1px solid rgba(127,127,127,.2);border-radius:16px;background:rgba(255,255,255,.08);position:sticky;top:72px;z-index:20;backdrop-filter:blur(12px)}.archive-search{flex:1;padding:13px 16px;border:1px solid rgba(127,127,127,.25);border-radius:13px;background:rgba(255,255,255,.05);color:inherit;font:inherit}.archive-count{opacity:.7}.archive-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.archive-card{min-width:0;padding:19px;border:1px solid rgba(127,127,127,.2);border-radius:18px;background:rgba(255,255,255,.035);box-shadow:0 9px 28px rgba(0,0,0,.07)}.archive-id{font:600 .72rem ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.55;overflow-wrap:anywhere}.archive-card h3{margin:8px 0;font-size:1.12rem;overflow-wrap:anywhere}.archive-card p{margin:0;line-height:1.6;opacity:.82}.archive-text{margin-top:12px;padding-top:12px;border-top:1px solid rgba(127,127,127,.16);white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.archive-empty{grid-column:1/-1;padding:30px;text-align:center;opacity:.7}.archive-pages{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px}.archive-pages button{padding:9px 14px;border:1px solid rgba(127,127,127,.25);border-radius:10px;background:transparent;color:inherit;cursor:pointer}.archive-pages button:disabled{opacity:.35}@media(max-width:900px){.archive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.archive-grid{grid-template-columns:1fr}}
</style></head><body class="page-body"><main class="page-main archive-wrap">
<section class="hero-card archive-hero"><span class="page-kicker">HISTORY ARCHIVE</span><h1>Archive</h1><p>Browse names, descriptions and text from the history archive.</p></section>
<div class="archive-tools"><input id="archive-search" class="archive-search" type="search" placeholder="Search Archive — ID, Name, Description, Link, all fields…" aria-label="Search Archive"><span id="archive-count" class="archive-count"></span></div>
<section id="archive-content" class="archive-grid"><div class="archive-empty">Loading archive…</div></section><div id="archive-pages" class="archive-pages"></div>
</main>
<script>
(()=>{"use strict";
const DATA_URL="https://raw.githubusercontent.com/ARARAT33/AWEArchiveDB/refs/heads/main/history.json",PAGE_SIZE=50;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const first=(o,keys)=>{for(const k of keys)if(o&&o[k]!=null&&String(o[k]).trim())return o[k];return""};
const rowsOf=d=>Array.isArray(d)?d:["items","records","history","archive","data","results"].flatMap(k=>Array.isArray(d?.[k])?d[k]:[]);
const safeUrl=v=>{try{const u=new URL(String(v??"").trim());return /^https?:$/.test(u.protocol)?u.href:""}catch{return""}};
let all=[],filtered=[],page=1;
const root=document.getElementById("archive-content"),search=document.getElementById("archive-search"),count=document.getElementById("archive-count"),pages=document.getElementById("archive-pages");
function card(o,i){
 const id=first(o,["id","ID","uuid","identifier"])||"record-"+(i+1),name=first(o,["name","title","label","filename","slug"])||"Untitled",desc=first(o,["description","desc","summary"])||"No description provided.",raw=first(o,["link","url","href","source"]),url=safeUrl(raw),txt=first(o,["text","content","body","article","textContent"]);
 const extra=Object.entries(o).filter(([k,v])=>v!=null&&v!==""&&!["id","ID","uuid","identifier","name","title","label","filename","slug","description","desc","summary","link","url","href","source","text","content","body","article","textContent"].includes(k)).map(([k,v])=>"<div><b>"+esc(k)+":</b> "+esc(typeof v==="object"?JSON.stringify(v):v)+"</div>").join("");
 return '<article class="archive-card"><div class="archive-id">ID · '+esc(id)+'</div><h3>'+esc(name)+'</h3><p>'+esc(desc)+'</p>'+(url?'<div class="archive-link"><b>Link:</b> <a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a></div>':"<div class="archive-link"><b>Link:</b> not available</div>")+(txt?'<div class="archive-text">'+esc(txt)+"</div>":"")+(extra?'<div class="archive-text">'+extra+"</div>":"")+"</article>";
}
function render(){
 const total=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE)),rows=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
 root.innerHTML=rows.length?rows.map(card).join(""):'<div class="archive-empty">No matching archive records.</div>';
 count.textContent=filtered.length+" results";
 pages.innerHTML='<button type="button" '+(page<=1?"disabled":"")+' data-step="-1">← Previous</button><span>Page '+page+" / "+total+'</span><button type="button" '+(page>=total?"disabled":"")+' data-step="1">Next →</button>';
 pages.querySelectorAll("button").forEach(b=>b.onclick=()=>{page+=Number(b.dataset.step);render();scrollTo({top:0,behavior:"smooth"})});
}
search.addEventListener("input",()=>{const q=search.value.trim().toLowerCase();filtered=all.filter(o=>JSON.stringify(o).toLowerCase().includes(q));page=1;render()});
fetch(DATA_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(d=>{all=rowsOf(d).filter(x=>x&&typeof x==="object");filtered=all;render()}).catch(e=>{console.error(e);root.innerHTML='<div class="archive-empty">Archive data could not be loaded right now.</div>'});
})();
</script><script src="site-tools.js?v=20260927-7"></script></body></html>
