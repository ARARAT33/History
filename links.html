<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History — HISTORY</title>
<link rel="stylesheet" href="pages.css">
<style>
.history-db-wrap{max-width:1200px;margin:0 auto;padding:24px}
.history-db-hero{margin-bottom:24px}.history-db-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.history-db-card{padding:22px;border:1px solid rgba(127,127,127,.2);border-radius:20px;background:rgba(255,255,255,.035);box-shadow:0 12px 35px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:14px}
.history-db-card h3{margin:0;font-size:1.25rem;overflow-wrap:anywhere}.history-db-card p{margin:0;line-height:1.65;opacity:.82;overflow-wrap:anywhere}
.history-db-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.76rem;opacity:.6;overflow-wrap:anywhere}
.history-db-link{display:block;overflow-wrap:anywhere;word-break:break-word}.history-db-link a{font-weight:600}
.history-preview{margin-top:4px;padding-top:16px;border-top:1px solid rgba(127,127,127,.16)}
.history-preview iframe{width:100%;height:430px;border:0;border-radius:14px;background:#111}
.history-preview video,.history-preview img{display:block;width:100%;max-height:520px;object-fit:contain;border-radius:14px;background:#111}
.history-preview iframe.is-website{height:520px}
.history-preview-fallback{padding:20px;border-radius:14px;background:rgba(127,127,127,.08);text-align:center}
.history-actions{display:flex;flex-wrap:wrap;gap:10px}.history-actions a{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:10px;text-decoration:none;border:1px solid rgba(127,127,127,.25)}
.history-db-extra{border-top:1px solid rgba(127,127,127,.16);padding-top:12px;display:grid;gap:7px}
.history-db-extra div{font-size:.85rem;overflow-wrap:anywhere}.history-db-empty,.history-db-error{padding:28px;border:1px dashed rgba(127,127,127,.35);border-radius:18px;text-align:center;opacity:.8}
</style>
</head>
<body class="page-body">
<main class="page-main history-db-wrap">
<section class="hero-card history-db-hero"><span class="page-kicker">HISTORY DATABASE</span><h1>History</h1><p>Historical pages and records from the AWEArchiveDB database.</p></section>
<section id="history-db-content" class="history-db-grid" aria-live="polite"><div class="history-db-empty">Loading history records…</div></section>
</main>
<script>
(function(){
"use strict";
const DATA_URL="https://raw.githubusercontent.com/ARARAT33/AWEArchiveDB/refs/heads/main/pagehistory.json";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const first=(o,keys)=>{for(const k of keys){if(o&&o[k]!=null&&String(o[k]).trim()!=="")return o[k]}return""};
const asArray=data=>{if(Array.isArray(data))return data;for(const k of ["items","records","history","pages","data","results"])if(Array.isArray(data?.[k]))return data[k];return[]};
const isUrl=v=>/^https?:\/\//i.test(String(v||"").trim());
function youtubeEmbed(u){try{const x=new URL(u);let id=x.hostname.includes("youtu.be")?x.pathname.slice(1):x.searchParams.get("v");return id?"https://www.youtube.com/embed/"+encodeURIComponent(id):""}catch{return""}}
function preview(url){
 if(!url)return"";
 const u=String(url).trim(), low=u.toLowerCase(), yt=youtubeEmbed(u);
 if(yt)return '<div class="history-preview"><iframe src="'+esc(yt)+'" title="Video preview" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>';
 if(/\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(low))return '<div class="history-preview"><video controls playsinline src="'+esc(u)+'"></video></div>';
 if(/\.(png|jpe?g|gif|webp|svg)(\?|#|$)/i.test(low))return '<div class="history-preview"><img src="'+esc(u)+'" alt=""></div>';
 return '<div class="history-preview"><iframe class="is-website" src="'+esc(u)+'" title="Embedded page" loading="lazy"></iframe></div>';
}
function card(item,index){
 const id=first(item,["id","ID","uuid","identifier"])||("record-"+(index+1));
 const name=first(item,["name","title","label","pageName","page_name","slug"])||"Untitled";
 const description=first(item,["description","desc","summary","text"])||"No description provided.";
 const url=first(item,["link","url","href","source"]);
 const extras=[];for(const [key,value] of Object.entries(item)){if(["id","ID","uuid","identifier","name","title","label","pageName","page_name","slug","description","desc","summary","text","link","url","href","source"].includes(key)||value==null||value==="")continue;extras.push("<div><strong>"+esc(key)+":</strong> "+esc(typeof value==="object"?JSON.stringify(value):value)+"</div>")}
 return '<article class="history-db-card"><div class="history-db-id">ID · '+esc(id)+'</div><h3>'+esc(name)+'</h3><p>'+esc(description)+'</p>'+preview(isUrl(url)?url:"")+(url?'<div class="history-actions"><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Open in browser ↗</a></div>':"")+(extras.length?'<div class="history-db-extra">'+extras.join("")+"</div>":"")+"</article>";
}
async function load(){const root=document.getElementById("history-db-content");try{const res=await fetch(DATA_URL,{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);const rows=asArray(await res.json()).filter(x=>x&&typeof x==="object");root.innerHTML=rows.length?rows.map(card).join(""):'<div class="history-db-empty" style="grid-column:1/-1">No history records are currently available.</div>'}catch(e){console.error(e);root.innerHTML='<div class="history-db-error" style="grid-column:1/-1">History data could not be loaded right now.</div>'}}
load();
})();
</script>
<script src="site-tools.js?v=20260927-4"></script>
</body>
</html>
