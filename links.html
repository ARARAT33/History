<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>History — HISTORY</title><link rel="stylesheet" href="pages.css">
<style>
.history-db-wrap{max-width:1280px;margin:auto;padding:22px}.history-db-hero{margin-bottom:18px}
.history-tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px;padding:12px;border:1px solid rgba(127,127,127,.2);border-radius:16px;background:rgba(255,255,255,.08);position:sticky;top:72px;z-index:20;backdrop-filter:blur(12px)}.history-search{flex:1 1 300px;padding:13px 16px;border:1px solid rgba(127,127,127,.25);border-radius:13px;background:rgba(255,255,255,.05);color:inherit;font:inherit}
.history-count{padding:12px 4px;opacity:.7}.history-db-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.history-db-card{min-width:0;padding:17px;border:1px solid rgba(127,127,127,.2);border-radius:18px;background:rgba(255,255,255,.035);box-shadow:0 9px 28px rgba(0,0,0,.07);display:flex;flex-direction:column;gap:10px}
.history-db-card h3{margin:0;font-size:1.12rem;overflow-wrap:anywhere}.history-db-card p{margin:0;line-height:1.55;opacity:.82;overflow-wrap:anywhere}.history-db-id{font:600 .72rem ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.55;overflow-wrap:anywhere}
.history-preview{border-top:1px solid rgba(127,127,127,.16);padding-top:10px}.history-preview iframe{display:block;width:100%;height:270px;border:0;border-radius:12px;background:#111}.history-preview video,.history-preview img{display:block;width:100%;max-height:360px;object-fit:contain;border-radius:12px;background:#111}
.history-preview iframe.is-website{height:330px}.history-actions{display:flex;gap:8px;flex-wrap:wrap}.history-actions a{display:inline-flex;padding:9px 12px;border-radius:10px;text-decoration:none;border:1px solid rgba(127,127,127,.25);font-weight:600}
.history-db-extra{border-top:1px solid rgba(127,127,127,.16);padding-top:9px;display:grid;gap:5px;font-size:.82rem}.history-empty{grid-column:1/-1;padding:30px;text-align:center;opacity:.7}.history-pages{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0}.history-pages button{padding:9px 14px;border:1px solid rgba(127,127,127,.25);border-radius:10px;background:transparent;color:inherit;cursor:pointer}.history-pages button:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:900px){.history-db-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.history-db-grid{grid-template-columns:1fr}.history-preview iframe.is-website{height:300px}}
</style></head><body class="page-body"><main class="page-main history-db-wrap">
<section class="hero-card history-db-hero"><span class="page-kicker">HISTORY DATABASE</span><h1>History</h1><p>Search and explore historical pages from the complete archive databases.</p></section>
<div class="history-tools"><input id="history-search" class="history-search" type="search" placeholder="Search History — ID, Name, Description, Link, all fields…" aria-label="Search History"><span id="history-count" class="history-count"></span></div>
<section id="history-db-content" class="history-db-grid"><div class="history-empty">Loading history…</div></section><div id="history-pages" class="history-pages"></div>
</main>
<script>
(()=>{"use strict";
const DATA_URL="https://raw.githubusercontent.com/ARARAT33/AWEArchiveDB/refs/heads/main/pagehistory.json",PAGE_SIZE=50;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const first=(o,keys)=>{for(const k of keys)if(o&&o[k]!=null&&String(o[k]).trim())return o[k];return""};
const rowsOf=d=>Array.isArray(d)?d:["items","records","history","pages","archive","data","results"].flatMap(k=>Array.isArray(d?.[k])?d[k]:[]);
const safeUrl=v=>{try{const u=new URL(String(v??"").trim());return /^https?:$/.test(u.protocol)?u.href:""}catch{return""}};
let all=[],filtered=[],page=1;
const root=document.getElementById("history-db-content"),search=document.getElementById("history-search"),count=document.getElementById("history-count"),pages=document.getElementById("history-pages");
function card(o,i){
 const id=first(o,["id","ID","uuid","identifier"])||"record-"+(i+1),name=first(o,["name","title","label","pageName","page_name","slug"])||"Untitled",desc=first(o,["description","desc","summary","text"])||"No description provided.",url=safeUrl(first(o,["link","url","href","source"]));
 const preview=url?'<div class="history-preview"><iframe src="'+esc(url)+'" title="Preview of '+esc(name)+'" loading="lazy" referrerpolicy="no-referrer" allow="fullscreen"></iframe><div class="history-preview-note">Եթե աղբյուրը արգելում է iframe-ը, օգտագործիր «Open link»։</div></div>':"";
 return '<article class="history-db-card"><div class="history-db-id">ID · '+esc(id)+'</div><h3>'+esc(name)+'</h3><p>'+esc(desc)+'</p>'+(url?'<div class="history-link"><b>Link:</b> <a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a></div>':"<div class="history-link"><b>Link:</b> not available</div>")+preview+(url?'<div class="history-actions"><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Open link ↗</a></div>':"")+"</article>";
}
function render(){
 const total=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE)),rows=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
 root.innerHTML=rows.length?rows.map(card).join(""):'<div class="history-empty">No matching links.</div>';
 count.textContent=filtered.length+" results";
 pages.innerHTML='<button type="button" '+(page<=1?"disabled":"")+' data-step="-1">← Previous</button><span>Page '+page+" / "+total+'</span><button type="button" '+(page>=total?"disabled":"")+' data-step="1">Next →</button>';
 pages.querySelectorAll("button").forEach(b=>b.onclick=()=>{page+=Number(b.dataset.step);render();scrollTo({top:0,behavior:"smooth"})});
}
search.addEventListener("input",()=>{const q=search.value.trim().toLowerCase();filtered=all.filter(o=>JSON.stringify(o).toLowerCase().includes(q));page=1;render()});
fetch(DATA_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(d=>{all=rowsOf(d).filter(x=>x&&typeof x==="object");filtered=all;render()}).catch(e=>{console.error(e);root.innerHTML='<div class="history-empty">Links data could not be loaded right now.</div>'});
})();
</script><script src="site-tools.js?v=20260927-7"></script></body></html>
