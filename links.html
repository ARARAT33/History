<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Links — WORLD HISTORY ARCHIVE</title>
<link rel="stylesheet" href="pages.css">
<style>
:root{color-scheme:dark}
body{margin:0}.links-page{max-width:1280px;margin:0 auto;padding:24px;box-sizing:border-box}
.links-head{margin-bottom:18px}.links-head h1{margin:6px 0}.links-head p{opacity:.75}
.links-search{position:sticky;top:10px;z-index:50;display:flex;gap:10px;align-items:center;padding:10px;margin-bottom:20px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(20,20,20,.94);backdrop-filter:blur(12px)}
.links-search input{box-sizing:border-box;flex:1;min-width:0;padding:13px 15px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#171717;color:#fff;font:inherit;outline:0}
.links-search input:focus{border-color:rgba(255,255,255,.5)}.links-count{white-space:nowrap;opacity:.65;font-size:13px}
.links-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.links-card{padding:14px;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:rgba(255,255,255,.035);overflow:hidden;min-width:0}
.links-card h2{margin:0 0 8px;overflow-wrap:anywhere}.links-card p{margin:0 0 12px;line-height:1.6;opacity:.82;white-space:pre-wrap}
.links-url{margin:0 0 12px;line-height:1.45;overflow-wrap:anywhere}.links-url a{color:inherit;word-break:break-all}
.links-preview{height:145px;overflow:hidden;border-radius:10px;background:#111}.links-preview.large{height:min(72vh,700px)}
.links-preview iframe{width:100%;height:100%;border:0;border-radius:10px;background:#111}
.links-preview img{display:block;width:100%;height:100%;object-fit:contain;background:#111}
.links-preview video{display:block;width:100%;height:100%;background:#111}
.links-preview audio{display:block;width:100%;margin-top:55px}
.links-preview embed,.links-preview object{width:100%;height:100%;border:0}
.links-preview pre{box-sizing:border-box;width:100%;height:100%;margin:0;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#111;font:13px/1.5 monospace}
.links-web-fallback{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;box-sizing:border-box;opacity:.8}
.links-youtube{position:relative;display:block;width:100%;height:100%;background:#111;overflow:hidden;text-decoration:none}
.links-youtube img{width:100%;height:100%;object-fit:cover}
.links-youtube-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:38px;border-radius:10px;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.links-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.links-actions button,.links-actions a{padding:8px 11px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:transparent;color:inherit;text-decoration:none;cursor:pointer;font:inherit}
.links-empty{padding:35px;text-align:center;opacity:.7;border:1px dashed rgba(255,255,255,.15);border-radius:14px}
.links-pages{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0}.links-pages button{padding:9px 14px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:transparent;color:inherit;cursor:pointer}.links-pages button:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:900px){.links-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.links-page{padding:14px}.links-search{top:5px}.links-count{font-size:12px}.links-list{grid-template-columns:1fr}.links-preview{height:190px}}
</style>
</head>
<body class="page-body">
<main class="page-main links-page">
<header class="hero-card links-head">
<span class="page-kicker">HISTORY LINKS</span>
<h1>Links</h1>
<p>Data is loaded directly from AWEArchiveDB/pagehistory.json.</p>
</header>
<div class="links-search">
<input id="links-search-input" type="search" autocomplete="off" placeholder="Search links by name, description or URL…" aria-label="Search links">
<span id="links-count" class="links-count">Loading…</span>
</div>
<section id="links-list" class="links-list"><div class="links-empty">Loading data…</div></section>
<nav id="links-pages" class="links-pages" aria-label="Links pages"></nav>
</main>
<script>
(() => {
"use strict";
const DATA_URL="https://raw.githubusercontent.com/ARARAT33/AWEArchiveDB/refs/heads/main/pagehistory.json";
const PAGE_SIZE=50;
const input=document.getElementById("links-search-input");
const list=document.getElementById("links-list");
const count=document.getElementById("links-count");
const pages=document.getElementById("links-pages");
let all=[],shown=[],page=1;

function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function field(o,k){return o&&o[k]!=null?String(o[k]).trim():"";}
function records(data){
 if(Array.isArray(data))return data;
 if(data&&Array.isArray(data.items))return data.items;
 if(data&&Array.isArray(data.results))return data.results;
 if(data&&Array.isArray(data.data))return data.data;
 return [];
}
function youtubeId(url){
 try{
  const u=new URL(url);let id="";
  const host=u.hostname.toLowerCase().replace(/^www\./,"");
  if(host==="youtu.be")id=u.pathname.split("/").filter(Boolean)[0]||"";
  if(host==="youtube.com"||host==="m.youtube.com"){
   if(u.pathname==="/watch")id=u.searchParams.get("v")||"";
   else if(u.pathname.startsWith("/shorts/"))id=u.pathname.split("/")[2]||"";
   else if(u.pathname.startsWith("/embed/"))id=u.pathname.split("/")[2]||"";
  }
  return /^[A-Za-z0-9_-]{6,20}$/.test(id)?id:"";
 }catch(e){return "";}
}
function mediaType(url){
 try{
  const u=new URL(url),p=u.pathname.toLowerCase();
  if(youtubeId(url))return "youtube";
  if(/\.(jpg|jpeg|png|gif|webp|svg|avif|bmp|ico)$/.test(p))return "image";
  if(/\.(mp4|webm|ogg|ogv|mov|m4v)$/.test(p))return "video";
  if(/\.(mp3|wav|oga|m4a|aac|flac)$/.test(p))return "audio";
  if(/\.(pdf)$/.test(p))return "pdf";
  if(/\.(txt|md|csv|json|xml|html|htm|log)$/.test(p))return "text";
  if(/\.(doc|docx|xls|xlsx|ppt|pptx|odt|ods|odp)$/.test(p))return "document";
  return "web";
 }catch(e){return "web";}
}
function preview(url,name){
 const type=mediaType(url),safeUrl=esc(url),safeName=esc(name);
 if(type==="youtube"){
  const id=youtubeId(url);
  return '<a class="links-youtube" href="'+safeUrl+'" target="_blank" rel="noopener noreferrer" aria-label="Open YouTube video"><img src="https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg" alt="'+safeName+'" loading="lazy"><span class="links-youtube-play">▶</span></a>';
 }
 if(type==="image")return '<img src="'+safeUrl+'" alt="'+safeName+'" loading="lazy">';
 if(type==="video")return '<video src="'+safeUrl+'" controls preload="metadata"></video>';
 if(type==="audio")return '<audio src="'+safeUrl+'" controls preload="metadata"></audio>';
 if(type==="pdf")return '<embed src="'+safeUrl+'" type="application/pdf">';
 if(type==="text")return '<iframe src="'+safeUrl+'" title="'+safeName+'" loading="lazy"></iframe>';
 if(type==="document")return '<iframe src="https://docs.google.com/gview?embedded=1&url='+encodeURIComponent(url)+'" title="'+safeName+'" loading="lazy"></iframe>';
 return '<div class="links-web-fallback">Preview unavailable for this website.<br>Use “Open original ↗” to view it.</div>';
}
function render(){
 const total=Math.max(1,Math.ceil(shown.length/PAGE_SIZE));if(page>total)page=total;
 const start=(page-1)*PAGE_SIZE,rows=shown.slice(start,start+PAGE_SIZE);
 if(!rows.length){list.innerHTML='<div class="links-empty">No matching results.</div>';}
 else{
  list.innerHTML=rows.map((o,i)=>{
   const id=field(o,"id")||String(start+i+1),name=field(o,"name")||"Untitled",description=field(o,"description"),url=field(o,"link"),frameId="frame-"+i;
   return '<article class="links-card">'+
    '<div style="opacity:.5;font-size:12px;margin-bottom:7px">ID · '+esc(id)+'</div>'+
    '<h2>'+esc(name)+'</h2>'+
    '<p>'+esc(description||"No description provided.")+'</p>'+
    '<div class="links-url"><strong>Link:</strong> '+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a>':"No link provided.")+'</div>'+
    (url?'<div class="links-preview" id="'+frameId+'">'+preview(url,name)+'</div>'+
      '<div class="links-actions"><button type="button" data-expand="'+frameId+'">Enlarge preview</button><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Open original ↗</a></div>':"")+
   '</article>';
  }).join("");
 }
 count.textContent=shown.length+" results";
 pages.innerHTML='<button type="button" id="lp" '+(page<=1?"disabled":"")+'>← Previous</button><span>Page '+page+" / "+total+'</span><button type="button" id="ln" '+(page>=total?"disabled":"")+'>Next →</button>';
 const prev=document.getElementById("lp"),next=document.getElementById("ln");
 if(prev)prev.onclick=()=>{page--;render();scrollTo(0,0)};
 if(next)next.onclick=()=>{page++;render();scrollTo(0,0)};
 document.querySelectorAll("[data-expand]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.expand).classList.toggle("large"));
}
function searchNow(){
 const q=input.value.trim().toLocaleLowerCase();
 shown=q?all.filter(o=>[field(o,"id"),field(o,"name"),field(o,"description"),field(o,"link")].join(" ").toLocaleLowerCase().includes(q)):all.slice();
 page=1;render();
}
input.addEventListener("input",searchNow);
fetch(DATA_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(d=>{all=records(d);shown=all.slice();render()}).catch(e=>{console.error(e);count.textContent="0 results";list.innerHTML='<div class="links-empty">Could not load pagehistory.json.</div>';});
})();
</script>
<script src="st2.js"></script>
</body>
</html>
