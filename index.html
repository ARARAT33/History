<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="HISTORY — open historical knowledge, maps, peoples, languages, animals and sources."><title>HISTORY — Open Historical Knowledge</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body>

<main class="map-only-main"><section class="section"><div class="states-layout"><div class="map-card"><div class="map-toolbar"><strong>OpenStreetMap · interactive map</strong><span id="map-status">Select a country</span><div class="map-controls"><button id="map-zoom-in" type="button" aria-label="Մեծացնել">+</button><button id="map-zoom-out" type="button" aria-label="Փոքրացնել">−</button><button id="map-reset" type="button">World</button></div></div><div id="world-map"></div></div><aside id="country-panel" class="country-panel"><div class="empty-panel"><span class="panel-icon">◎</span><h3>Select a country</h3><p>Select a country to inspect its data and historical context.</p></div></aside></div></section><section class="history-explorer" id="history-explorer"><div class="explorer-tabs"><button class="explorer-tab active" data-mode="states">States</button><button class="explorer-tab" data-mode="peoples">Peoples</button><button class="explorer-tab" data-mode="languages">Languages</button><button class="explorer-tab" data-mode="animals">Animals</button></div><div class="explorer-controls"><label>Year / century <input id="history-year" type="number" placeholder="e.g. 1200"></label><label>Search entity <input id="history-entity" placeholder="Search…"></label><button id="history-apply" type="button">Show on map</button><button id="history-now" type="button">Present</button></div><div class="timeline-wrap"><input id="history-slider" type="range" min="-5000" max="2026" value="2026" step="1"><div class="timeline-labels"><span>5000 BCE</span><strong id="history-current">2026</strong><span>Present</span></div></div><div id="history-entity-list" class="entity-list"></div><div id="history-inspector" class="history-inspector"><div class="inspector-placeholder"><span>✦</span><strong>Select a mode and date</strong><p>Choose States, Peoples, Languages or Animals, then select an entity to inspect its available historical data.</p></div></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js?v=20260927-8"></script><script src="site-tools.js?v=20260927-6"></script><script>(function(){var s=document.getElementById("history-language");if(!s)return;s.addEventListener("change",function(){var c=this.value;try{localStorage.setItem("history-language",c);}catch(e){}document.cookie="googtrans="+(c==="en"?"; path=/; max-age=0":"/en/"+c+"; path=/; max-age=31536000");location.reload();});})();</script></body></html>
