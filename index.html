<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="HISTORY — open historical knowledge, maps, peoples, languages, animals and sources."><title>HISTORY — Open Historical Knowledge</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"><style>
.history-explorer{margin:0 22px 22px;background:#171514;border:1px solid #ffffff18;border-radius:20px;color:#fff;padding:18px;box-shadow:0 20px 60px #0005}.explorer-tabs{display:flex;gap:7px;flex-wrap:wrap}.explorer-tab{border:1px solid #ffffff22;background:#26211f;color:#ddd;padding:9px 13px;border-radius:10px;cursor:pointer}.explorer-tab.active{background:#d76545;color:#fff}.explorer-controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.explorer-controls label{font-size:11px;color:#bbb;display:flex;flex-direction:column;gap:5px}.explorer-controls input{background:#24201e;color:#fff;border:1px solid #ffffff25;border-radius:9px;padding:9px}.explorer-controls button{background:#fff;color:#151312;border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.timeline-wrap{padding:10px 0}.timeline-wrap input{width:100%;accent-color:#d76545}.timeline-labels{display:flex;justify-content:space-between;color:#aaa;font-size:10px}.timeline-labels strong{color:#fff}.entity-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px}.entity-list button{background:#24201e;color:#eee;border:1px solid #ffffff18;padding:11px;text-align:left;border-radius:10px;cursor:pointer}.history-inspector{margin-top:14px;border-top:1px solid #ffffff18;padding-top:15px}.inspector-placeholder{text-align:center;color:#aaa;padding:18px}.inspector-placeholder span{font-size:25px;color:#d76545}.entity-card{display:grid;grid-template-columns:1fr auto;gap:5px;background:#211d1b;padding:12px;border-radius:12px}.entity-card strong{color:#fff}.entity-card small{color:#999}.entity-card button{grid-row:span 2}.history-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.history-fact{background:#211d1b;border-radius:10px;padding:11px}.history-fact span{display:block;color:#999;font-size:10px}.history-fact strong{display:block;margin-top:4px}.history-sources{margin-top:12px;font-size:11px;color:#aaa}.history-sources a{color:#e9a28e}
</style></head><body>

<main class="map-only-main"><section class="section"><div class="states-layout"><div class="map-card"><div class="map-toolbar"><strong>OpenStreetMap · interactive map</strong><span id="map-status">Select a country</span><div class="map-controls"><button id="map-zoom-in" type="button" aria-label="Մեծացնել">+</button><button id="map-zoom-out" type="button" aria-label="Փոքրացնել">−</button><button id="map-reset" type="button">World</button></div></div><div id="world-map"></div></div><aside id="country-panel" class="country-panel"><div class="empty-panel"><span class="panel-icon">◎</span><h3>Select a country</h3><p>Select a country to inspect its data and historical context.</p></div></aside></div></section><section class="history-explorer" id="history-explorer"><div class="explorer-tabs"><button class="explorer-tab active" data-mode="states">States</button><button class="explorer-tab" data-mode="peoples">Peoples</button><button class="explorer-tab" data-mode="languages">Languages</button><button class="explorer-tab" data-mode="animals">Animals</button></div><div class="explorer-controls"><label>Year / century <input id="history-year" type="number" placeholder="e.g. 1200"></label><label>Search entity <input id="history-entity" placeholder="Search…"></label><button id="history-apply" type="button">Show on map</button><button id="history-now" type="button">Present</button></div><div class="timeline-wrap"><input id="history-slider" type="range" min="-5000" max="2026" value="2026" step="1"><div class="timeline-labels"><span>5000 BCE</span><strong id="history-current">2026</strong><span>Present</span></div></div><div id="history-entity-list" class="entity-list"></div><div id="history-inspector" class="history-inspector"><div class="inspector-placeholder"><span>✦</span><strong>Select a mode and date</strong><p>Choose States, Peoples, Languages or Animals, then select an entity to inspect its available historical data.</p></div></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js?v=20260927-6"></script><script src="site-tools.js?v=20260927-5"></script></body></html>
